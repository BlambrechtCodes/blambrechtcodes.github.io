name: Contact Form Handler
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Sender name'
        required: true
        type: string
      email:
        description: 'Sender email'
        required: true
        type: string
      subject:
        description: 'Message subject'
        required: true
        type: string
      message:
        description: 'Message content'
        required: true
        type: string

jobs:
  handle-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        env:
          EMAIL_USER: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # Install Node.js and nodemailer
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          # Create temporary script
          cat > send-email.js << 'EOF'
          const nodemailer = require('nodemailer');
          
          const transporter = nodemailer.createTransport({
            host: 'smtp.gmail.com',
            port: 465,
            secure: true,
            auth: {
              user: process.env.EMAIL_USER,
              pass: process.env.EMAIL_PASS,
            },
          });
          
          const mailOptions = {
            from: process.env.EMAIL_USER,
            to: process.env.EMAIL_USER,
            replyTo: '${{ github.event.inputs.email }}',
            subject: 'Contact Form: ${{ github.event.inputs.subject }}',
            html: `
              <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                <h2 style="color: #333;">New Contact Form Submission</h2>
                <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0;">
                  <h3 style="margin-top: 0; color: #555;">Message Details:</h3>
                  <p><strong>Name:</strong> ${{ github.event.inputs.name }}</p>
                  <p><strong>Email:</strong> ${{ github.event.inputs.email }}</p>
                  <p><strong>Subject:</strong> ${{ github.event.inputs.subject }}</p>
                  <p><strong>Message:</strong></p>
                  <div style="background: white; padding: 15px; border-radius: 4px; border-left: 4px solid #007bff;">
                    ${{ github.event.inputs.message }}
                  </div>
                </div>
                <p style="color: #666; font-size: 12px;">
                  This message was sent through your portfolio contact form at ${new Date().toLocaleString()}.
                </p>
              </div>
            `,
          };
          
          transporter.sendMail(mailOptions, (error, info) => {
            if (error) {
              console.error('Error:', error);
              process.exit(1);
            } else {
              console.log('Email sent:', info.response);
            }
          });
          EOF
          
          # Run the script
          node send-email.js