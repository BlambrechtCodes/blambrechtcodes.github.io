name: Test Email Secrets
on: [workflow_dispatch]  # Manual trigger
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          EMAIL_USER: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          echo "User: ${EMAIL_USER:0:3}***"  # First 3 chars masked
          echo "Pass: ${EMAIL_PASS:0:3}***"
          test -n "$EMAIL_USER" && echo "✓ EMAIL_ADDRESS loaded"
          test -n "$EMAIL_PASS" && echo "✓ EMAIL_PASSWORD loaded"